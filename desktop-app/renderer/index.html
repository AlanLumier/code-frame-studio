<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob: data:; script-src 'self' 'unsafe-eval';"
  />
  <title>codemv</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-theme="dark">
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3l1.9 5.6L19.5 10l-5.6 1.9L12 17.5l-1.9-5.6L4.5 10l5.6-1.4z" />
          <circle cx="18.5" cy="18.5" r="1.4" />
        </svg>
        <div>
          <div class="brand-name">codemv</div>
          <div class="brand-sub">AI 逐帧画面生成</div>
        </div>
      </div>

      <div class="song-meta">
        <div id="songTitle" class="song-title">还没有导入歌曲</div>
        <div id="songSub" class="song-sub">拖入音乐和 .lrc 歌词开始</div>
      </div>

      <div class="top-actions">
        <button id="btnAudio" class="btn">导入音乐</button>
        <button id="btnLyrics" class="btn">导入歌词</button>
        <button id="btnGenerate" class="btn primary" disabled>AI 生成画面</button>
        <button id="btnSettings" class="btn icon" title="设置">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M12 15.5A3.5 3.5 0 1 0 12 8.5a3.5 3.5 0 0 0 0 7z" />
            <path d="M19.4 13.5c.1-.5.1-1 0-1.5l1.8-1.4-1.8-3.2-2.2.9c-.4-.3-.8-.6-1.3-.8L15.4 5h-3.8l-.5 2.5c-.5.2-.9.5-1.3.8l-2.2-.9-1.8 3.2L7.6 12c-.1.5-.1 1 0 1.5l-1.8 1.4 1.8 3.2 2.2-.9c.4.3.8.6 1.3.8l.5 2.5h3.8l.5-2.5c.5-.2.9-.5 1.3-.8l2.2.9 1.8-3.2z" />
          </svg>
        </button>
      </div>
    </header>

    <div class="workspace">
      <aside class="rail">
        <button class="rail-btn active" data-rail="import">素材</button>
        <button class="rail-btn" data-rail="lyrics">歌词</button>
        <button class="rail-btn" data-rail="settings">设置</button>
      </aside>

      <main class="stage-wrap">
        <div class="stage-frame" id="dropZone">
          <canvas id="stage" width="1280" height="720"></canvas>
          <div class="lyrics-overlay" id="lyricsOverlay">
            <div class="lyric-line prev" id="lyricPrev"></div>
            <div class="lyric-line cur" id="lyricCur"></div>
            <div class="lyric-line next" id="lyricNext"></div>
          </div>
          <div class="stage-hint" id="stageHint">导入音乐后，AI 会为每一句歌词生成专属画面</div>
          <div class="drop-hint" id="dropHint">把音乐或 .lrc 拖到这里</div>
        </div>

        <div class="transport">
          <button id="btnPlay" class="play-btn" title="播放">
            <svg id="playIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          </button>
          <span class="time" id="timeNow">00:00</span>
          <input id="seek" class="seek" type="range" min="0" max="1000" value="0" />
          <span class="time" id="timeTotal">00:00</span>
          <span class="flex-space"></span>
          <span class="status" id="genStatus">未生成画面</span>
        </div>
      </main>

      <aside class="panel">
        <div class="panel-head">
          <span>歌词</span>
          <span class="badge" id="lineCount">0 句</span>
        </div>
        <div class="mood-box">
          <label for="moodInput">这首歌的感觉（可选）</label>
          <textarea id="moodInput" rows="2" placeholder="例如：温柔、孤独，像在夜里的海边散步"></textarea>
        </div>
        <div class="lyric-list" id="lyricList"></div>
        <div class="panel-foot">
          AI 由内置服务提供，无需填写 Key
        </div>
      </aside>
    </div>
  </div>

  <dialog id="settingsDialog" class="settings-dialog">
    <div class="settings-card">
      <div class="settings-head">
        <h2>设置</h2>
        <button id="btnCloseSettings" class="btn icon" title="关闭">×</button>
      </div>
      <div class="settings-body">
        <section>
          <h3>外观</h3>
          <label class="field">主题
            <select id="setTheme">
              <option value="dark">深色</option>
              <option value="light">浅色</option>
            </select>
          </label>
          <label class="field">强调色 <input type="color" id="setAccent" /></label>
        </section>
        <section>
          <h3>歌词</h3>
          <label class="field">显示方式
            <select id="setSubtitleMode">
              <option value="karaoke">逐字高亮</option>
              <option value="line">整句出现</option>
            </select>
          </label>
          <label class="field">字号 <input type="range" id="setSubtitleSize" min="0.8" max="1.6" step="0.05" /></label>
          <label class="field">位置
            <select id="setSubtitlePos">
              <option value="bottom">底部</option>
              <option value="center">中下</option>
            </select>
          </label>
        </section>
        <section>
          <h3>更新</h3>
          <div class="row">
            <span id="versionText">版本 —</span>
            <button type="button" id="btnCheckUpdate" class="btn">检查更新</button>
          </div>
          <div class="row"><a href="#" id="linkRepo">打开 GitHub 仓库</a></div>
          <div id="updateStatus" class="status"></div>
        </section>
        <section>
          <h3>AI 服务</h3>
          <p class="hint">默认使用内置免费 AI 服务，不需要 API Key。生成失败会自动重试。</p>
        </section>
      </div>
      <div class="settings-foot">
        <button type="button" id="btnResetSettings" class="btn">恢复默认</button>
        <button type="button" id="btnDoneSettings" class="btn primary">完成</button>
      </div>
    </div>
  </dialog>

  <input type="file" id="fileAudio" accept="audio/*" hidden />
  <input type="file" id="fileLyrics" accept=".lrc,.txt,text/plain" hidden />
  <audio id="audio"></audio>
  <div id="toast" class="toast"></div>
  <script src="scene-kit.js"></script>
  <script src="app.js"></script>
</body>
</html>
